<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện tập GDQPAN 12 (xem đáp án ngay)</title>
<style>
:root{--bg:#eef1ed;--sf:#fff;--ink:#1c241e;--mu:#59655d;--ac:#3d5a38;--acx:#fff;--sel:#e6eee3;--ok:#1b7a43;--okbg:#e0f2e6;--bad:#b3261e;--badbg:#fbe8e6;--ln:#d2dad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111612;--sf:#1a211b;--ink:#e5ebe5;--mu:#98a59b;--ac:#93bb88;--acx:#10170f;--sel:#243124;--ok:#62c78c;--okbg:#14301f;--bad:#f1908a;--badbg:#3a1a18;--ln:#2d372f}}
:root[data-theme="dark"]{--bg:#111612;--sf:#1a211b;--ink:#e5ebe5;--mu:#98a59b;--ac:#93bb88;--acx:#10170f;--sel:#243124;--ok:#62c78c;--okbg:#14301f;--bad:#f1908a;--badbg:#3a1a18;--ln:#2d372f}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;line-height:1.25;margin:8px 0 4px}
h2{font-size:1.05rem;margin:0 0 8px}
.mu{color:var(--mu)}.sm{font-size:.85rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin:12px 0}
.q{font-size:1.08rem;line-height:1.5;font-weight:600;margin:6px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn:disabled{opacity:.45;cursor:default}
.nav,.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.acts{display:grid;gap:10px;margin:12px 0}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.chk input{width:20px;height:20px;accent-color:var(--ac)}.chk span{flex:1}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-top:8px}
.prog{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--ac)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}
.opt>span:last-of-type{flex:1}
.opt em{flex:none;font-style:normal;font-size:.8rem;font-weight:700}
.lt{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt.sel,.seg .sel,.tabs .sel{border:2px solid var(--ac);background:var(--sel)}
.opt.sel .lt{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.opt.ok{border:2px solid var(--ok);background:var(--okbg)}
.opt.no{border:2px solid var(--bad);background:var(--badbg)}
.st{padding:12px 0;border-top:1px solid var(--ln)}.st p{margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.tabs button{padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);font-weight:600}
.st.ok{border-left:4px solid var(--ok);padding-left:10px}
.st.no{border-left:4px solid var(--bad);padding-left:10px;background:var(--badbg)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:12px}
.pal button{padding:8px 0;border:1.5px solid var(--ln);border-radius:8px;background:var(--sf)}
.pal .dn{background:var(--sel);border-color:var(--ac)}.pal .cur{outline:2px solid var(--ink)}
summary{cursor:pointer;font-weight:600}
.sum{text-align:center}.big{font-size:3rem;font-weight:700;line-height:1.1}
.rv.noc{border-left:5px solid var(--bad)}.rv.okc{border-left:5px solid var(--ok)}
.note{background:var(--sel);padding:10px 12px;border-radius:8px;margin:10px 0 0;font-size:.95rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--ln)}
.tm{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.top .btn{width:auto;padding:8px 20px}
.txt{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit}
.lb{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.lb b:first-child{width:28px}.lb span{flex:1}
.nt{color:var(--bad);font-weight:600}.gt{color:var(--ok);font-weight:600}
.seg .ok{border:2px solid var(--ok);background:var(--okbg)}
.seg .no{border:2px solid var(--bad);background:var(--badbg)}
.pal .okc{background:var(--okbg);border-color:var(--ok)}.pal .noc{background:var(--badbg);border-color:var(--bad)}
.opt:disabled,.seg button:disabled{cursor:default}
</style>
</head>

<script>
const Q=[{"part":1,"lesson":2,"n":1,"q":"Cơ quan nào tham mưu với Đảng, Nhà nước về đường lối, nhiệm vụ quân sự, quốc phòng bảo vệ Tổ quốc và quản lý nhà nước về lĩnh vực quân sự, quốc phòng trong phạm vi cả nước?","opts":["Bộ Quốc phòng","Bộ Tổng Tham mưu","Tổng cục Chính trị","Bộ chỉ huy quân sự cấp tỉnh"],"stmts":[],"ans":0,"note":"","id":0},{"part":1,"lesson":2,"n":2,"q":"Chức năng chỉ huy, điều hành, xây dựng phát triển lực lượng và huấn luyện sẵn sàng chiến đấu của Quân đội nhân dân và Dân quân tự vệ thuộc về cơ quan nào?","opts":["Tổng cục Hậu cần","Bộ Tổng Tham mưu","Tổng cục Chính trị","Tổng cục Kỹ thuật"],"stmts":[],"ans":1,"note":"","id":1},{"part":1,"lesson":2,"n":3,"q":"Tổng cục Chính trị trong Quân đội nhân dân Việt Nam đảm nhiệm công tác nào?","opts":["Quản lý công tác kinh tế quốc phòng","Đảm bảo trang bị vũ khí, khí tài","Đảm nhiệm công tác Đảng, công tác chính trị trong toàn quân","Chỉ đạo công tác tác chiến không gian mạng"],"stmts":[],"ans":2,"note":"","id":2},{"part":1,"lesson":2,"n":4,"q":"Cơ quan nào chỉ đạo công tác quốc phòng và xây dựng tiềm lực quân sự trong thời bình; chỉ đạo, chỉ huy lực lượng vũ trang thuộc quyền trong thời chiến để bảo vệ lãnh thổ quân khu?","opts":["Quân đoàn","Quân khu","Bộ Tư lệnh","Sư đoàn"],"stmts":[],"ans":1,"note":"","id":3},{"part":1,"lesson":2,"n":5,"q":"Đơn vị cơ động lớn nhất của Lục quân, có nhiệm vụ bảo vệ các địa bàn chiến lược trọng yếu của quốc gia là:","opts":["Lữ đoàn","Trung đoàn","Quân đoàn","Sư đoàn"],"stmts":[],"ans":2,"note":"","id":4},{"part":1,"lesson":2,"n":6,"q":"Cơ quan quân sự nào có chức năng tham mưu cho cấp uỷ Đảng, chính quyền địa phương và cơ quan quân sự cấp trên về công tác quân sự, quốc phòng trên địa bàn cấp tỉnh?","opts":["Ban chỉ huy quân sự cấp xã","Bộ chỉ huy quân sự cấp tỉnh","Bộ Tư lệnh Quân khu","Ban chỉ huy quân sự cấp huyện"],"stmts":[],"ans":1,"note":"","id":5},{"part":1,"lesson":2,"n":7,"q":"Ban chỉ huy quân sự cấp xã có chức năng nào sau đây?","opts":["Quản lý các quân đoàn cơ động","Tham mưu cho cấp uỷ Đảng, chính quyền cấp xã lãnh đạo, chỉ đạo, quản lý, điều hành thực hiện nhiệm vụ quốc phòng, quân sự trên địa bàn cấp xã","Chỉ đạo lực lượng vũ trang trên địa bàn toàn tỉnh","Trực tiếp điều hành các trường đại học quân sự"],"stmts":[],"ans":1,"note":"","id":6},{"part":1,"lesson":2,"n":8,"q":"Quân hiệu của Quân đội nhân dân Việt Nam có dạng hình gì?","opts":["Hình vòm","Hình vuông","Hình tròn","Hình bầu dục"],"stmts":[],"ans":2,"note":"","id":7},{"part":1,"lesson":2,"n":9,"q":"Điểm đặc biệt trên Quân hiệu đường kính 41 mm và 36 mm của Quân đội nhân dân Việt Nam là:","opts":["Được dập rời với cành tùng kép","Không có hai bông lúa màu vàng","Được dập liền với cành tùng kép màu vàng","Có hình cành mai bao quanh"],"stmts":[],"ans":2,"note":"","id":8},{"part":1,"lesson":2,"n":10,"q":"Hệ thống cấp bậc quân hàm của sĩ quan Quân đội nhân dân Việt Nam gồm mấy cấp, mấy bậc?","opts":["3 cấp, 9 bậc","3 cấp, 12 bậc","4 cấp, 12 bậc","2 cấp, 8 bậc"],"stmts":[],"ans":1,"note":"","id":9},{"part":1,"lesson":2,"n":11,"q":"Cấp bậc quân hàm cao nhất trong ngạch sĩ quan Quân đội nhân dân Việt Nam là:","opts":["Thượng tướng","Đô đốc Hải quân","Đại tướng","Trung tướng"],"stmts":[],"ans":2,"note":"","id":10},{"part":1,"lesson":2,"n":12,"q":"Cấp bậc quân hàm của hạ sĩ quan trong Quân đội nhân dân Việt Nam gồm các bậc nào?","opts":["Binh nhì, Binh nhất","Hạ sĩ, Trung sĩ, Thượng sĩ","Thiếu úy, Trung úy, Thượng úy","Chuẩn úy, Hạ sĩ, Thượng sĩ"],"stmts":[],"ans":1,"note":"","id":11},{"part":1,"lesson":2,"n":13,"q":"Cấp hiệu của sĩ quan Lục quân Quân đội nhân dân Việt Nam có đặc điểm nào sau đây?","opts":["Nền màu vàng, viền màu xanh lá cây","Nền màu vàng, viền màu đỏ tươi","Nền màu xanh dương, viền màu vàng","Nền màu be, viền màu đỏ tươi"],"stmts":[],"ans":1,"note":"","id":12},{"part":1,"lesson":2,"n":14,"q":"Cấp hiệu của lực lượng Bộ đội Biên phòng khác cấp hiệu Lục quân ở điểm nào?","opts":["Viền cấp hiệu màu tím than","Nền cấp hiệu màu xanh lá cây","Nền cấp hiệu màu xanh hoà bình","Có thêm hình bánh xe lịch"],"stmts":[],"ans":1,"note":"","id":13},{"part":1,"lesson":2,"n":15,"q":"Điểm khác biệt trên nền cấp hiệu của Quân nhân chuyên nghiệp so với sĩ quan Quân đội là:","opts":["Viền cấp hiệu màu xanh dương","Có một đường màu hồng ở chính giữa theo chiều dọc","Không có sao vàng","Nền cấp hiệu màu trắng"],"stmts":[],"ans":1,"note":"","id":14},{"part":1,"lesson":2,"n":16,"q":"Cấp hiệu của lực lượng Cảnh sát biển Việt Nam có đặc điểm nền và viền màu gì?","opts":["Nền màu vàng, viền màu tím than","Nền màu xanh dương, viền màu vàng","Nền màu xanh lá cây, viền màu đỏ tươi","Nền màu be, viền màu đỏ tươi"],"stmts":[],"ans":1,"note":"","id":15},{"part":1,"lesson":2,"n":17,"q":"Phù hiệu có hình biểu tượng hai khẩu súng tiểu liên chéo nhau trên nền đỏ đại diện cho lực lượng/binh chủng nào?","opts":["Pháo binh","Binh chủng hợp thành - Bộ binh","Tăng - Thiết giáp","Đặc công"],"stmts":[],"ans":1,"note":"","id":16},{"part":1,"lesson":2,"n":18,"q":"Phù hiệu gắn trên cổ áo của Binh chủng Thông tin trong Quân đội có hình biểu tượng gì?","opts":["Chiếc xe tăng","Hai nòng pháo chéo nhau","Tia sét","Cuốc xẻng chéo nhau"],"stmts":[],"ans":2,"note":"","id":17},{"part":1,"lesson":2,"n":19,"q":"Hệ thống tổ chức của Công an nhân dân Việt Nam bao gồm các cấp nào?","opts":["Bộ Công an; Công an cấp tỉnh; Công an cấp huyện; Công an cấp xã","Bộ Công an; Công an cấp tỉnh; Công an cấp xã; Công an tại đơn vị hành chính - kinh tế đặc biệt","Bộ Công an và Công an các Quân khu","Bộ Công an; Công an các vùng hải quân; Công an cấp xã"],"stmts":[],"ans":1,"note":"","id":18},{"part":1,"lesson":2,"n":20,"q":"Cơ quan nào tham mưu với Đảng, Nhà nước về bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội, đấu tranh phòng chống tội phạm?","opts":["Cục Cảnh sát giao thông","Bộ Công an","Bộ Tư lệnh Cảnh vệ","Cục Cảnh sát hình sự"],"stmts":[],"ans":1,"note":"","id":19},{"part":1,"lesson":2,"n":21,"q":"Đơn vị nào thuộc Bộ Công an có chức năng tham mưu và tổ chức thự u hộ","Ngôn ngữ Anh, Ngôn ngữ Trung Quốc"],"stmts":[],"ans":1,"note":"","id":53},{"part":1,"lesson":3,"n":55,"q":"Học viện Cảnh sát nhân dân đào tạo nhóm ngành chính nào sau đây?","opts":["Nghiệp vụ An ninh, An ninh mạng","Trinh sát cảnh sát, Quản lý hành chính về trật tự xã hội, Cảnh sát giao thông","Kỹ thuật Công an nhân dân, Y khoa","Xây dựng Đảng và chính quyền Nhà nước"],"stmts":[],"ans":1,"note":"","id":54},{"part":1,"lesson":3,"n":56,"q":"Học viện Chính trị Công an nhân dân đào tạo ngành nghề nào?","opts":["Trinh sát cảnh sát","Xây dựng Đảng và chính quyền Nhà nước","Hậu cần Công an nhân dân","Ngôn ngữ Anh"],"stmts":[],"ans":1,"note":"","id":55},{"part":1,"lesson":3,"n":57,"q":"Trường Đại học Phòng cháy chữa cháy thuộc lực lượng nào và đào tạo ngành gì?","opts":["Thuộc Bộ Quốc phòng, đào tạo Chỉ huy PCCC","Thuộc Bộ Công an, đào tạo ngành Phòng cháy chữa cháy và cứu nạn, cứu hộ","Thuộc Bộ Xây dựng, đào tạo Kỹ thuật PCCC","Thuộc Bộ Lao động - Thương binh và Xã hội"],"stmts":[],"ans":1,"note":"","id":56},{"part":1,"lesson":3,"n":58,"q":"Quyền lợi đặc thù của học viên khi trúng tuyển vào học tại các trường Quân đội, Công an là gì?","opts":["Được tự do lựa chọn nơi làm việc sau khi tốt nghiệp","Được Nhà nước bảo đảm tiền ăn, trang phục, chỗ ở, đồ dùng học tập và không phải đóng học phí","Được cấp học bổng du học nước ngoài tự túc","Được miễn nghĩa vụ quân sự vĩnh viễn không cần làm việc"],"stmts":[],"ans":1,"note":"","id":57},{"part":1,"lesson":3,"n":59,"q":"Trách nhiệm của gia đình và nhà trường trong công tác tuyển sinh quân sự, công an là gì?","opts":["Trực tiếp thẩm tra lý lịch chính trị của học sinh","Thường xuyên làm tốt công tác tuyên truyền về truyền thống, định hướng nghề nghiệp, phối hợp chặt chẽ với Ban TSQS và Công an","Tổ chức khám sức khỏe định kỳ cho thí sinh dự tuyển","Cấp giấy chứng nhận sơ tuyển cho học sinh"],"stmts":[],"ans":1,"note":"","id":58},{"part":1,"lesson":3,"n":60,"q":"Cơ quan nào có trách nhiệm phân công cán bộ thẩm tra, xác minh làm rõ những vấn đề về lý lịch chính trị, quan hệ xã hội của thí sinh dự tuyển?","opts":["BGH Trường THPT","Ban Tuyển sinh quân sự, Công an cấp xã/huyện","Bộ Giáo dục và Đào tạo","UBND cấp tỉnh"],"stmts":[],"ans":1,"note":"","id":59},{"part":2,"lesson":2,"n":1,"q":"Về chức năng, nhiệm vụ của một số tổ chức trong Quân đội nhân dân Việt Nam:","opts":[],"stmts":["Bộ Quốc phòng là cơ quan tham mưu với Đảng, Nhà nước về đường lối, nhiệm vụ quân sự, quốc phòng.","Bộ Tổng Tham mưu đảm nhiệm công tác Đảng và công tác chính trị trong toàn quân.","Quân khu có nhiệm vụ chỉ đạo công tác quốc phòng và xây dựng tiềm lực quân sự trong thời bình.","Quân đoàn là đơn vị cơ động lớn nhất của Lục quân, bảo vệ các địa bàn chiến lược trọng yếu."],"ans":[true,false,true,true],"note":"Ý b sai vì công tác Đảng, công tác chính trị thuộc về Tổng cục Chính trị","id":60},{"part":2,"lesson":2,"n":2,"q":"Về cơ quan quân sự địa phương:","opts":[],"stmts":["Bộ chỉ huy quân sự cấp tỉnh tham mưu cho cấp ủy Đảng, chính quyền địa phương về công tác quân sự, quốc phòng.","Ban chỉ huy quân sự cấp xã trực tiếp chỉ huy các quân đoàn cơ động.","Bộ Tư lệnh Thủ đô Hà Nội là một trong những cơ quan quân sự địa phương.","Ban chỉ huy quân sự cấp xã có nhiệm vụ tham mưu, điều hành nhiệm vụ quốc phòng, quân sự trên địa bàn cấp xã."],"ans":[true,false,true,true],"note":"Ý b sai vì quân đoàn trực thuộc Bộ Quốc phòng, không thuộc cấp xã","id":61},{"part":2,"lesson":2,"n":3,"q":"Về Đặc điểm Quân hiệu và Cấp hiệu Quân đội nhân dân Việt Nam:","opts":[],"stmts":["Quân hiệu có dạng hình tròn, ở giữa có ngôi sao năm cánh màu vàng nổi trên nền đỏ tươi.","Cấp hiệu của sĩ quan Lục quân có nền màu vàng và viền màu đỏ tươi.","Cấp hiệu của sĩ quan cấp tướng Lục quân có in chìm hoa văn mặt trống đồng trên nền cấp hiệu.","Cấp hiệu của hạ sĩ quan, binh sĩ Lục quân có nền màu vàng viền màu tím than."],"ans":[true,true,true,false],"note":"Ý d sai vì hạ sĩ quan, binh sĩ Lục quân có nền màu be, viền màu đỏ tươi","id":62},{"part":2,"lesson":2,"n":4,"q":"Về Cấp hiệu các quân, binh chủng và lực lượng trong Quân đội:","opts":[],"stmts":["Cấp hiệu Bộ đội Biên phòng có nền màu xanh lá cây.","Cấp hiệu Quân chủng Hải quân có viền màu xanh hoà bình.","Cấp hiệu Cảnh sát biển Việt Nam có nền màu xanh dương, viền màu vàng.","Cấp hiệu Quân nhân chuyên nghiệp có thêm một đường màu hồng ở chính giữa theo chiều dọc."],"ans":[true,false,true,true],"note":"Ý b sai vì Hải quân có viền màu tím than; viền xanh hoà bình là PK-KQ","id":63},{"part":2,"lesson":2,"n":5,"q":"Về hệ thống cấp bậc quân hàm trong Quân đội nhân dân Việt Nam:","opts":[],"stmts":["Cấp sĩ quan gồm 3 cấp, 12 bậc.","Cấp tướng gồm 4 bậc: Thiếu tướng (Chuẩn Đô đốc HQ), Trung tướng (Phó Đô đốc HQ), Thượng tướng (Đô đốc HQ), Đại tướng.","Cấp tá gồm 3 bậc: Thiếu tá, Trung tá, Đại tá.","Binh sĩ gồm 2 bậc: Binh nhì, Binh nhất."],"ans":[true,true,false,true],"note":"Ý c sai vì cấp tá gồm 4 bậc: Thiếu tá, Trung tá, Thượng tá, Đại tá","id":64},{"part":2,"lesson":2,"n":6,"q":"Về chức năng, nhiệm vụ của các đơn vị thuộc Bộ Công an:","opts":[],"stmts":["Cục Cảnh sát giao thông tổ chức thực hiện bảo đảm trật tự, an toàn giao thông đường bộ, đường sắt, đường thủy.","Cục An ninh mạng trực tiếp đảm bảo trật tự an toàn giao thông đường bộ.","Bộ Tư lệnh Cảnh vệ có nhiệm vụ bảo vệ an toàn tuyệt đối cho cán bộ lãnh đạo cấp cao của Đảng và Nhà nước.","Bộ Tư lệnh Cảnh sát cơ động thực hiện biện pháp vũ trang bảo vệ an ninh, giữ gìn trật tự, an toàn xã hội."],"ans":[true,false,true,true],"note":"Ý b sai vì Cục An ninh mạng quản lý nhà nước về an ninh mạng và chống tội phạm công nghệ cao","id":65},{"part":2,"lesson":2,"n":7,"q":"Về đặc điểm Công an hiệu và Phù hiệu Công an nhân dân:","opts":[],"stmts":["Công an hiệu có dạng hình tròn, đường kính 36 mm.","Ở giữa nửa bánh xe trên Công an hiệu có chữ lồng \"CA\" màu vàng.","Phù hiệu đeo ở cổ áo của sĩ quan Công an nhân dân có màu xanh lá cây.","Phù hiệu của sĩ quan cấp tướng Công an có viền ba cạnh màu vàng."],"ans":[true,true,false,true],"note":"Ý c sai vì phù hiệu cổ áo Công an có màu đỏ","id":66},{"part":2,"lesson":2,"n":8,"q":"Về hệ thống cấp bậc quân hàm trong Công an nhân dân:","opts":[],"stmts":["Sĩ quan nghiệp vụ có 3 cấp, 12 bậc.","Sĩ quan chuyên môn kỹ thuật có 2 cấp, 7 bậc (không có cấp tướng).","Hạ sĩ quan gồm 3 bậc: Hạ sĩ, Trung sĩ, Thượng sĩ.","Chiến sĩ nghĩa vụ có 3 bậc: Binh nhì, Binh nhất, Thượng sĩ."],"ans":[true,true,true,false],"note":"Ý d sai vì chiến sĩ nghĩa vụ chỉ có 2 bậc: Binh nhì, Binh nhất","id":67},{"part":2,"lesson":2,"n":9,"q":"Về phân biệt cấp hiệu trong Công an nhân dân:","opts":[],"stmts":["Cấp hiệu sĩ quan cấp tướng có nền màu đỏ, viền màu vàng, dệt hoa văn hình cành tùng chạy dọc.","Cấp hiệu sĩ quan cấp tá, cấp úy nghiệp vụ có vạch rộng 6 mm màu xanh thẫm chạy dọc.","Cấp hiệu sĩ quan cấp tá, cấp úy chuyên môn kỹ thuật có vạch dọc màu xanh thẫm.","Hạ sĩ quan nghiệp vụ có vạch bằng vải rộng 6 mm màu vàng ở cuối nền cấp hiệu."],"ans":[true,false,true,true],"note":"Ý b sai vì sĩ quan nghiệp vụ có vạch màu vàng","id":68},{"part":2,"lesson":2,"n":10,"q":"Về hệ thống tổ chức Công an cấp tỉnh và cấp xã:","opts":[],"stmts":["Công an cấp tỉnh tham mưu cho cấp ủy, UBND tỉnh và quản lý nhà nước về an ninh trật tự trên địa bàn tỉnh.","Công an cấp xã làm nòng cốt trong xây dựng phong trào toàn dân bảo vệ an ninh Tổ quốc ở địa bàn cấp xã.","Công an cấp xã do Bộ trưởng Bộ Quốc phòng trực tiếp điều hành.","Bộ trưởng Bộ Công an có quyền quyết định thành lập đồn, trạm công an độc lập."],"ans":[true,true,false,true],"note":"Ý c sai vì Công an thuộc hệ thống Bộ Công an","id":69},{"part":2,"lesson":3,"n":11,"q":"Về hệ thống các nhà trường Quân đội:","opts":[],"stmts":["Học viện Quốc phòng và Học viện Lục quân là các trường KHÔNG tuyển sinh học sinh phổ thông.","Học viện Kỹ thuật Quân sự có tên gọi khác là Trường Đại học Lê Quý Đôn.","Trường Sĩ quan Lục quân 2 còn có tên gọi là Trường Đại học Trần Quốc Tuấn.","Trong hệ thống trường quân đội còn có các trường cao đẳng, trung cấp và trường quân sự quân khu, quân đoàn."],"ans":[true,true,false,true],"note":"Ý c sai vì ĐH Trần Quốc Tuấn là SQ Lục quân 1; SQ Lục quân 2 là ĐH Nguyễn Huệ","id":70},{"part":2,"lesson":3,"n":12,"q":"Về quy định đối tượng và độ tuổi tuyển sinh đại học quân sự:","opts":[],"stmts":["Thanh niên ngoài quân đội từ 18 đến 25 tuổi đều đủ điều kiện độ tuổi dự tuyển.","Thanh niên ngoài quân đội độ tuổi dự tuyển tính đến năm dự tuyển là không quá 21 tuổi.","Quân nhân tại ngũ hoặc đã xuất ngũ độ tuổi dự tuyển là không quá 23 tuổi.","Công dân hoàn thành nghĩa vụ tham gia CAND có độ tuổi dự tuyển quân sự không quá 23 tuổi."],"ans":[false,true,true,true],"note":"Ý a sai vì thanh niên ngoài quân đội không quá 21 tuổi","id":71},{"part":2,"lesson":3,"n":13,"q":"Về quy trình đăng ký sơ tuyển và xét tuyển vào trường Quân đội:","opts":[],"stmts":["Thí sinh là thanh niên ngoài quân đội mua hồ sơ sơ tuyển tại Ban Tuyển sinh quân sự cấp xã.","Thí sinh không cần qua bước sơ tuyển vẫn được đăng ký xét tuyển bình thường.","Thí sinh đăng ký nguyện vọng xét tuyển qua cổng thông tin tuyển sinh của Bộ GD&ĐT hoặc Cổng Dịch vụ công quốc gia.","Bộ Quốc phòng áp dụng 4 phương thức tuyển sinh trình độ đại học, cao đẳng chính quy."],"ans":[true,false,true,true],"note":"Ý b sai vì tất cả thí sinh dự tuyển đều bắt buộc phải qua sơ tuyển","id":72},{"part":2,"lesson":3,"n":14,"q":"Về vùng tuyển sinh của các trường Sĩ quan Lục quân:","opts":[],"stmts":["Trường Sĩ quan Lục quân 1 tuyển sinh thí sinh từ tỉnh Hà Tĩnh trở ra phía Bắc.","Trường Sĩ quan Lục quân 2 tuyển sinh thí sinh từ tỉnh Quảng Trị trở vào phía Nam.","Trường Sĩ quan Lục quân 1 tuyển sinh trên phạm vi toàn quốc.","Thí sinh có hộ khẩu tại TP. Hồ Chí Minh đăng ký dự tuyển vào Trường Sĩ quan Lục quân 2."],"ans":[true,true,false,true],"note":"Ý c sai vì Lục quân 1 chỉ tuyển từ Hà Tĩnh trở ra Bắc","id":73},{"part":2,"lesson":3,"n":15,"q":"Về ngành nghề đào tạo tại các Học viện Quân đội:","opts":[],"stmts":["Học viện Quân y đào tạo Bác sĩ Y khoa, Dược sĩ và Y học dự phòng.","Học viện Hậu cần đào tạo phi công phản lực và phi công trực thăng.","Học viện Khoa học Quân sự đào tạo các ngành Ngôn ngữ Anh, Nga, Pháp, Trung Quốc và Quan hệ quốc tế.","Học viện Biên phòng đào tạo ngành Quản lý biên giới, Phòng chống ma túy và tội phạm."],"ans":[true,false,true,true],"note":"Ý b sai vì đào tạo phi công thuộc Trường Sĩ quan Không quân","id":74},{"part":2,"lesson":3,"n":16,"q":"Về ngành nghề đào tạo tại các trường Sĩ quan Quân đội:","opts":[],"stmts":["Trường Sĩ quan Thông tin đào tạo chỉ huy, kỹ thuật thông tin và Tác chiến không gian mạng.","Trường Sĩ quan Chính trị đào tạo sĩ quan ngành Xây dựng Đảng và chính quyền Nhà nước.","Trường Sĩ quan Đặc công đào tạo các ngành Đặc công Bộ, Đặc công Nước, Đặc công Biệt động.","Trường Sĩ quan Pháo binh đào tạo kỹ thuật xe máy quân sự và đạn dược."],"ans":[true,true,true,false],"note":"Ý d sai vì Pháo binh đào tạo Chỉ huy tham mưu Pháo binh; xe máy đạn dược do Trường SQ Kỹ thuật Quân sự đào tạo","id":75},{"part":2,"lesson":3,"n":17,"q":"Về hệ thống nhà trường Công an nhân dân:","opts":[],"stmts":["Học viện An ninh nhân dân và Học viện Cảnh sát nhân dân thuộc hệ thống các học viện Công an.","Trường Đại học Phòng cháy chữa cháy trực thuộc Bộ Quốc phòng.","Trường Đại học An ninh nhân dân tuyển sinh thí sinh phía Nam tính từ TP. Đà Nẵng trở vào.","Hệ thống trường Công an gồm các học viện, trường đại học và trường cao đẳng."],"ans":[true,false,true,true],"note":"Ý b sai vì ĐH PCCC thuộc Bộ Công an","id":76},{"part":2,"lesson":3,"n":18,"q":"Về quy định độ tuổi và sơ tuyển vào các trường Công an nhân dân:","opts":[],"stmts":["Học sinh phổ thông dự tuyển vào trường Công an không quá 22 tuổi.","Thí sinh là người dân tộc thiểu số dự tuyển vào trường Công an được áp dụng độ tuổi không quá 25 tuổi.","Thí sinh mua hồ sơ và đăng ký sơ tuyển tại Công an cấp xã.","Thí sinh đạt học sinh giỏi quốc gia không cần tham gia sơ tuyển tại địa phương."],"ans":[true,true,true,false],"note":"Ý d sai vì tất cả thí sinh dự tuyển đều phải qua sơ tuyển","id":77},{"part":2,"lesson":3,"n":19,"q":"Về ngành nghề đào tạo trong các trường Công an nhân dân:","opts":[],"stmts":["Học viện Cảnh sát nhân dân đào tạo Trinh sát cảnh sát, Quản lý hành chính về TTXH, Cảnh sát giao thông.","Học viện An ninh nhân dân đào tạo ngành Nghiệp vụ An ninh và An ninh mạng.","Học viện Chính trị Công an nhân dân đào tạo ngành Phòng cháy chữa cháy.","Trường Đại học PCCC đào tạo ngành Phòng cháy chữa cháy và cứu nạn, cứu hộ."],"ans":[true,true,false,true],"note":"Ý c sai vì HV Chính trị CAND đào tạo ngành Xây dựng Đảng và chính quyền Nhà nước","id":78},{"part":2,"lesson":3,"n":20,"q":"Về nghĩa vụ và quyền lợi của học viên các trường lực lượng vũ trang:","opts":[],"stmts":["Học viên trúng tuyển được Nhà nước bảo đảm tiền ăn, trang phục, chỗ ở và miễn học phí.","Sau khi tốt nghiệp, học viên phải sẵn sàng chấp hành sự phân công công tác của Bộ Quốc phòng hoặc Bộ Công an.","Ban Tuyển sinh quân sự, Công an cấp xã/huyện có trách nhiệm phân công cán bộ thẩm tra lý lịch chính trị của thí sinh.","Gia đình và nhà trường không có trách nhiệm phối hợp với cơ quan tuyển sinh trong công tác định hướng nghề nghiệp."],"ans":[true,true,true,false],"note":"Ý d sai vì gia đình, nhà trường phải phối hợp chặt chẽ với cơ quan tuyển sinh","id":79}];
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const SETS=[[1,2,'Phần I, Bài 2 (trắc nghiệm)'],[1,3,'Phần I, Bài 3 (trắc nghiệm)'],[2,2,'Phần II, Bài 2 (đúng/sai)'],[2,3,'Phần II, Bài 3 (đúng/sai)']];
let S={orig:[],list:[],ans:{},i:0,shuf:true,warn:false,tab:'wrong',t0:0,el:0,iv:0};
function tick(){S.el=Math.floor((Date.now()-S.t0)/1000);const e=$('#tm');if(e)e.textContent='⏱ '+fmt(S.el)}
const done=q=>{const a=S.ans[q.id];return q.part==1?a!==undefined:Array.isArray(a)&&a.every(x=>x!==null)};
function grade(q){const a=S.ans[q.id];if(q.part==1)return{q,ok:a===q.ans};const c=q.ans.filter((v,k)=>a&&a[k]===v).length;return{q,ok:c==4,c}}
const rq=()=>{const y=scrollY;quiz();scrollTo(0,y)};
const go=i=>{S.i=i;quiz();scrollTo(0,0)};

function home(){
  clearInterval(S.iv);
  const cnt=(p,l)=>Q.filter(q=>q.part==p&&q.lesson==l).length;
  app.innerHTML=`<h1>Luyện tập GDQPAN lớp 12</h1><p class="mu">Chế độ xem đáp án ngay: chọn xong là biết đúng hay sai.</p>
  <div class="card"><h2>Chọn phần muốn làm</h2>
  ${SETS.map(([p,l,t],k)=>`<label class="chk"><input type="checkbox" data-k="${k}" checked><span>${t}</span><b>${cnt(p,l)} câu</b></label>`).join('')}
  <label class="chk"><input type="checkbox" id="shuf" ${S.shuf?'checked':''}><span>Xáo trộn thứ tự câu hỏi</span></label></div>
  <p class="nt" id="err"></p><button class="btn pri" id="go">Bắt đầu làm bài</button>`;
  $('#go').onclick=()=>{
    const ks=[...document.querySelectorAll('[data-k]:checked')].map(e=>+e.dataset.k);
    if(!ks.length){$('#err').textContent='Hãy chọn ít nhất một phần.';return}
    S.shuf=$('#shuf').checked;
    start(Q.filter(q=>ks.some(k=>SETS[k][0]==q.part&&SETS[k][1]==q.lesson)),true);
  };
}
function start(list,orig){
  if(orig)S.orig=list;
  S.list=S.shuf?shuffle(list):list;S.ans={};S.i=0;S.warn=false;S.tab='wrong';
  S.t0=Date.now();S.el=0;clearInterval(S.iv);S.iv=setInterval(tick,1000);quiz();scrollTo(0,0);
}

function quiz(){
  const q=S.list[S.i],n=S.list.length,a=S.ans[q.id];
  const left=S.list.filter(x=>!done(x)).length,w=S.warn&&left;
  let body,fb='';
  if(q.part==1){
    const dn=a!==undefined;
    body=q.opts.map((o,k)=>{const c=dn?(k===q.ans?' ok':k===a?' no':''):'';
      return `<button class="opt${c}" data-k="${k}" ${dn?'disabled':''}><span class="lt">${'ABCD'[k]}</span><span>${esc(o)}</span>${dn&&k===q.ans?'<em>Đáp án đúng</em>':dn&&k===a?'<em>Bạn chọn</em>':''}</button>`}).join('');
    if(dn)fb=a===q.ans?'<p class="gt">Chính xác!</p>':`<p class="nt">Sai rồi. Đáp án đúng là ${'ABCD'[q.ans]}.</p>`;
  }else{
    body=q.stmts.map((s,k)=>{const m=a?a[k]:null,r=q.ans[k];
      return `<div class="st${m===null?'':m===r?' ok':' no'}"><p><b>${'abcd'[k]})</b> ${esc(s)}</p><div class="seg">${[true,false].map(v=>`<button data-k="${k}" data-v="${v}" ${m!==null?'disabled':''} class="${m!==null&&v===r?'ok':m===v&&v!==r?'no':''}">${v?'Đúng':'Sai'}</button>`).join('')}</div>${m===null?'':`<div class="sm ${m===r?'gt':'nt'}">${m===r?'Chính xác!':'Sai rồi. Đáp án là '+(r?'Đúng':'Sai')+'.'}</div>`}</div>`}).join('');
    if(done(q)&&q.note)fb=`<p class="note">Giải thích: ${esc(q.note)}.</p>`;
  }
  const pc=x=>!done(x)?'':grade(x).ok?'okc':'noc';
  app.innerHTML=`<div class="top"><span class="tm" id="tm">⏱ ${fmt(S.el)}</span><button class="btn pri" id="sub">Kết thúc</button></div>
  <div class="bar"><span>Câu ${S.i+1}/${n}</span><span class="${w?'nt':'mu'} sm">${w?`Còn ${left} câu chưa làm. Bấm Kết thúc lần nữa`:`Còn ${left} câu chưa làm`}</span></div>
  <div class="prog"><i style="width:${(n-left)/n*100}%"></i></div>
  <div class="card"><div class="mu sm">${q.part==1?'Chọn một đáp án đúng':'Chọn Đúng hoặc Sai cho từng ý'}</div><h2 class="q">${esc(q.q)}</h2>${body}${fb}</div>
  <div class="nav"><button class="btn" id="pv" ${S.i==0?'disabled':''}>Câu trước</button><button class="btn" id="nx" ${S.i==n-1?'disabled':''}>Câu sau</button></div>
  <details class="card"><summary>Danh sách câu hỏi</summary><div class="pal">${S.list.map((x,k)=>`<button data-j="${k}" class="${pc(x)}${k==S.i?' cur':''}">${k+1}</button>`).join('')}</div></details>`;
  if(q.part==1)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(S.ans[q.id]===undefined){S.ans[q.id]=+b.dataset.k;S.warn=false;rq()}});
  else app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const r=S.ans[q.id]||(S.ans[q.id]=[null,null,null,null]),k=+b.dataset.k;if(r[k]===null){r[k]=b.dataset.v==='true';S.warn=false;rq()}});
  $('#pv').onclick=()=>go(S.i-1);$('#nx').onclick=()=>go(S.i+1);
  app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>go(+b.dataset.j));
  $('#sub').onclick=()=>{if(left&&!S.warn){S.warn=true;rq()}else finish()};
}
function finish(){clearInterval(S.iv);tick();S.tab='wrong';result();scrollTo(0,0)}

function review({q,ok,c}){
  const a=S.ans[q.id],no=S.list.indexOf(q)+1;let b;
  if(q.part==1){
    b=q.opts.map((o,k)=>{const right=k===q.ans,mine=k===a;
      return `<div class="opt${right?' ok':mine?' no':''}"><span class="lt">${'ABCD'[k]}</span><span>${esc(o)}</span>${right?'<em>Đáp án đúng</em>':mine?'<em>Bạn chọn</em>':''}</div>`}).join('');
    if(a===undefined)b+='<p class="nt">Bạn chưa trả lời câu này.</p>';
  }else{
    b=q.stmts.map((s,k)=>{const m=a?a[k]:null,r=q.ans[k],good=m===r;
      return `<div class="st ${good?'ok':'no'}"><p><b>${'abcd'[k]})</b> ${esc(s)}</p><div class="sm">Bạn chọn: <b>${m===null?'chưa chọn':m?'Đúng':'Sai'}</b>, đáp án: <b>${r?'Đúng':'Sai'}</b> ${good?'✓':'✗'}</div></div>`}).join('');
    if(q.note)b+=`<p class="note">Giải thích: ${esc(q.note)}.</p>`;
  }
  return `<div class="card rv ${ok?'okc':'noc'}"><div class="mu sm">Câu ${no}${q.part==2?`, đúng ${c}/4 ý`:''}</div><h3 class="q">${esc(q.q)}</h3>${b}</div>`;
}
function result(){
  const g=S.list.map(grade),wrong=g.filter(x=>!x.ok),n=g.length,r=n-wrong.length;
  const show=S.tab=='wrong'?wrong:g;
  app.innerHTML=`<div class="card sum"><div class="big">${r}/${n}</div><div>câu đúng, ${Math.round(r/n*100)}%</div><div class="mu">Thời gian: ${fmt(S.el)}</div></div>
  <div class="acts">${wrong.length?`<button class="btn pri" id="rw">Làm lại ${wrong.length} câu sai</button>`:'<p class="gt">Bạn đã làm đúng hết. Giỏi lắm!</p>'}
  <button class="btn" id="ra">Làm lại toàn bộ đề</button><button class="btn" id="hm">Về trang chủ</button></div>
  <div class="tabs"><button data-t="wrong" class="${S.tab=='wrong'?'sel':''}">Câu sai (${wrong.length})</button><button data-t="all" class="${S.tab=='all'?'sel':''}">Tất cả (${n})</button></div>
  ${show.map(review).join('')||'<p class="mu">Không có câu sai nào.</p>'}`;
  if(wrong.length)$('#rw').onclick=()=>start(wrong.map(x=>x.q));
  $('#ra').onclick=()=>start(S.orig,true);$('#hm').onclick=home;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;const y=scrollY;result();scrollTo(0,y)});
}
home();
</script>
</body>
