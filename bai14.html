<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện tập GDQPAN Bài 1 và Bài 4</title>
<style>
:root{--bg:#eef1ed;--sf:#fff;--ink:#1c241e;--mu:#59655d;--ac:#3d5a38;--acx:#fff;--sel:#e6eee3;--ok:#1b7a43;--okbg:#e0f2e6;--bad:#b3261e;--badbg:#fbe8e6;--ln:#d2dad2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111612;--sf:#1a211b;--ink:#e5ebe5;--mu:#98a59b;--ac:#93bb88;--acx:#10170f;--sel:#243124;--ok:#62c78c;--okbg:#14301f;--bad:#f1908a;--badbg:#3a1a18;--ln:#2d372f}}
:root[data-theme="dark"]{--bg:#111612;--sf:#1a211b;--ink:#e5ebe5;--mu:#98a59b;--ac:#93bb88;--acx:#10170f;--sel:#243124;--ok:#62c78c;--okbg:#14301f;--bad:#f1908a;--badbg:#3a1a18;--ln:#2d372f}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:1.5rem;line-height:1.25;margin:8px 0 4px}
h2{font-size:1.05rem;margin:0 0 8px}
.mu{color:var(--mu)}.sm{font-size:.85rem}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;margin:12px 0}
.q{font-size:1.08rem;line-height:1.5;font-weight:600;margin:6px 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.btn{width:100%;padding:12px 16px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}
.btn:disabled{opacity:.45;cursor:default}
.nav,.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.acts{display:grid;gap:10px;margin:12px 0}
.chk{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--ln)}
.chk input{width:20px;height:20px;accent-color:var(--ac)}.chk span{flex:1}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-top:8px}
.prog{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--ac)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;margin-top:8px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf)}
.opt>span:last-of-type{flex:1}
.opt em{flex:none;font-style:normal;font-size:.8rem;font-weight:700}
.lt{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:.8rem;font-weight:700}
.opt.sel,.seg .sel,.tabs .sel{border:2px solid var(--ac);background:var(--sel)}
.opt.sel .lt{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.opt.ok{border:2px solid var(--ok);background:var(--okbg)}
.opt.no{border:2px solid var(--bad);background:var(--badbg)}
.st{padding:12px 0;border-top:1px solid var(--ln)}.st p{margin:0 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.tabs button{padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);font-weight:600}
.st.ok{border-left:4px solid var(--ok);padding-left:10px}
.st.no{border-left:4px solid var(--bad);padding-left:10px;background:var(--badbg)}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-top:12px}
.pal button{padding:8px 0;border:1.5px solid var(--ln);border-radius:8px;background:var(--sf)}
.pal .dn{background:var(--sel);border-color:var(--ac)}.pal .cur{outline:2px solid var(--ink)}
summary{cursor:pointer;font-weight:600}
.sum{text-align:center}.big{font-size:3rem;font-weight:700;line-height:1.1}
.rv.noc{border-left:5px solid var(--bad)}.rv.okc{border-left:5px solid var(--ok)}
.note{background:var(--sel);padding:10px 12px;border-radius:8px;margin:10px 0 0;font-size:.95rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:center;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--ln)}
.tm{font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.top .btn{width:auto;padding:8px 20px}
.txt{width:100%;padding:12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit}
.lb{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}.lb b:first-child{width:28px}.lb span{flex:1}
.nt{color:var(--bad);font-weight:600}.gt{color:var(--ok);font-weight:600}
.seg .ok{border:2px solid var(--ok);background:var(--okbg)}
.seg .no{border:2px solid var(--bad);background:var(--badbg)}
.pal .okc{background:var(--okbg);border-color:var(--ok)}.pal .noc{background:var(--badbg);border-color:var(--bad)}
.opt:disabled,.seg button:disabled{cursor:default}
</style>
</head>

<script>
const Q=[{"part":1,"lesson":1,"n":1,"q":"Ngay sau khi lên cầm quyền vào tháng 4/1975, tập đoàn Pol Pot - Ieng Sary đã có hành động phản bội nào đối với Nhân dân Việt Nam","opts":["Tuyên bố cắt đứt quan hệ ngoại giao và mở rộng hợp tác với phương Tây.","Phản bội lại quan hệ hữu nghị, âm mưu phá hoại mối quan hệ hai nước và gây xung đột biên giới.","Đòi lại toàn bộ khu vực đồng bằng sông Cửu Long bằng con đường đàm phán.","Ký kết bản hiệp ước biên giới mới không qua tham khảo ý kiến Việt Nam."],"ans":1,"id":0},{"part":1,"lesson":1,"n":2,"q":"Vào ngày 3/5/1975, tập đoàn Pol Pot - Ieng Sary đã tiến công đánh chiếm đảo nào của Việt Nam?","opts":["Đảo Thổ Chu.","Đảo Phú Quốc.","Đảo Côn Đảo.","Đảo Lý Sơn"],"ans":1,"id":1},{"part":1,"lesson":1,"n":3,"q":"Tập đoàn Pol Pot - Ieng Sary đã đánh chiếm đảo Thổ Chu và bắt và sát hại hơn 500 đồng bào ta vào thời điểm nào?","opts":["Ngày 30/4/1975.","Ngày 3/5/1975.","Ngày 10/5/1975.","Ngày 15/6/1978."],"ans":2,"id":2},{"part":1,"lesson":1,"n":4,"q":"Tập đoàn Pol Pot - Ieng Sary huy động lực lượng quân sự quy mô lớn xâm phạm biên giới nước ta từ Kiên Giang đến Tây Ninh vào ngày này","opts":["Ngày 30/4/1975.","Ngày 30/4/1977.","Ngày 23/12/1978.","Ngày 7/1/1979."],"ans":1,"id":3},{"part":1,"lesson":1,"n":5,"q":"Trước hành động xâm lược của tập đoàn Pol Pot - Ieng Sary, Đảng và Nhà nước ta ban đầu đã sử dụng biện pháp nào để cứu vãn hoà bình?","opts":["Dùng mọi biện pháp ngoại giao hoà bình.","Lập tức phát động chiến tranh tổng lực ngay từ đầu.","Nhờ sự can thiệp trực tiếp của Liên Hợp Quốc.","Rút toàn bộ lực lượng khỏi vùng biên giới."],"ans":0,"id":4},{"part":1,"lesson":1,"n":6,"q":"Bộ Chính trị và Quân uỷ Trung ương quyết định phát động chiến tranh nhân dân bảo vệ biên giới Tây Nam vào thời gian nào?","opts":["Ngày 30/4/1977.","Ngày 15/6/1978.","Ngày 2/12/1978,","Ngày 23/12/1978."],"ans":1,"id":5},{"part":1,"lesson":1,"n":7,"q":"Mặt trận Đoàn kết dân tộc cứu nước Campuchia được thành lập vào ngày tháng năm nào?","opts":["Ngày 15/6/1978.","Ngày 2/12/1978.","Ngày 23/12/1978.","Ngày 7/1/1979."],"ans":1,"id":6},{"part":1,"lesson":1,"n":8,"q":"Quân và dân ta tổ chức cuộc tổng phản công trên toàn tuyến biên giới Tây Nam bắt đầu từ ngày này","opts":["Ngày 15/6/1978.","Ngày 2/12/1978.","Ngày 23/12/1978.","Ngày 7/1/1979."],"ans":2,"id":7},{"part":1,"lesson":1,"n":9,"q":"Thủ đô Phnom Penh (Campuchia) được hoàn toàn giải phóng khỏi chế độ diệt chủng Pol Pot vào ngày tháng năm nào","opts":["Ngày 23/12/1978.","Ngày 7/1/1979.","Ngày 17/2/1979.","Ngày 5/3/1979."],"ans":1,"id":8},{"part":1,"lesson":1,"n":10,"q":"Cuộc chiến tranh bảo vệ biên giới Tây Nam của Tổ quốc mang tính chất gì?","opts":["Chiến tranh mở rộng lãnh thổ.","Hành động tự vệ chính đáng và chính nghĩa.","Cuộc can thiệp nội bộ theo yêu cầu tư bản.","Chiến tranh tranh chấp tài nguyên biển."],"ans":1,"id":9},{"part":1,"lesson":1,"n":11,"q":"Trong chiến tranh bảo vệ biên giới Tây Nam, nghệ thuật quân sự nổi bật của ta là kết hợp chặt chẽ giữa:","opts":["Lực lượng tại chỗ và lực lượng của các binh đoàn chủ lực.","Lực lượng không quân và hải quân đánh bộ.","Vũ khí hiện đại và vũ khí hạt nhân.","Quân đội chính quy và lực lượng gìn giữ hòa bình quốc tế."],"ans":0,"id":10},{"part":1,"lesson":1,"n":12,"q":"Từ năm 1975 đến năm 1978, ở biên giới phía Bắc, chính quyền Trung Quốc đã có những hành động vi phạm nào?","opts":["Tăng cường hoạt động quân sự, khiêu khích vũ trang, xâm lấn đất đai.","Tuyên bố phong tỏa toàn bộ vùng biển miền Bắc Việt Nam.","Cắt đứt hoàn toàn quan hệ ngoại giao và kinh tế.","Đưa quân chiếm đóng các tỉnh Tây Bắc Việt Nam."],"ans":0,"id":11},{"part":1,"lesson":1,"n":13,"q":"Chính quyền Trung Quốc huy động lực lượng lớn tiến công xâm lược biên giới phía Bắc nước ta vào ngày tháng năm nào?","opts":["Ngày 30/4/1977.","Ngày 7/1/1979.","Ngày 17/2/1979.","Ngày 5/3/1979."],"ans":2,"id":12},{"part":1,"lesson":1,"n":14,"q":"Các tỉnh dọc biên giới phía Bắc chịu đợt tiến công trực tiếp của quân xâm lược vào ngày 17/2/1979 trải dài từ:","opts":["Quảng Ninh đến Lạng Sơn.","Lạng Sơn đến Hà Giang.","Quảng Ninh đến Lai Châu.","Cao Bằng đến Điện Biên."],"ans":2,"id":13},{"part":1,"lesson":1,"n":15,"q":"Chủ tịch nước Cộng hoà xã hội chủ nghĩa Việt Nam ra lệnh Tổng động viên trong cả nước vào ngày nào?","opts":["Ngày 17/2/1979.","Ngày 5/3/1979,","Ngày 18/3/1979.","Ngày 15/6/1978."],"ans":1,"id":14},{"part":1,"lesson":1,"n":16,"q":"Đến ngày 18/3/1979, tình hình biên giới phía Bắc nước ta có biến động gì quan trọng?","opts":["Hai bên kí kết hiệp ước hòa bình mới.","Về cơ bản đối phương đã rút quân khỏi nước ta.","Quân ta bắt đầu cuộc tổng tiến công sang bên kia biên giới.","Liên Hợp Quốc cử lực lượng đến giám sát biên giới."],"ans":1,"id":15},{"part":1,"lesson":1,"n":17,"q":"Một trong những tư tưởng chỉ đạo nghệ thuật quân sự trong cuộc chiến đấu bảo vệ biên giới phía Bắc là:","opts":["\"Đánh nhanh thắng nhanh, tiêu diệt gọn sinh lực địch\".","\"Lấy nhỏ đánh lớn, lấy ít địch nhiều\".","\"Tận dụng tối đa vũ khí hiện đại từ nước ngoài\".","\"Chờ đối phương suy yếu mới tiến hành phản công”."],"ans":1,"id":16},{"part":1,"lesson":1,"n":18,"q":"Nước ta có bờ biển dài bao nhiêu km và có hơn bao nhiêu hòn đảo lớn nhỏ?","opts":["Bờ biển dài hơn 2.000 km, hơn 1.000 hòn đảo.","Bờ biển dài hơn 3 200 km, hơn 3.000 hòn đảo.","Bờ biển dài hơn 4 500 km, hơn 2.000 hòn đảo.","Bờ biển dài hơn 5 000 km, hơn 4 000 hòn đảo."],"ans":1,"id":17},{"part":1,"lesson":1,"n":19,"q":"Hai quần đảo thuộc chủ quyền thiêng liêng của Việt Nam trên Biển Đông là","opts":["Hoàng Sa và Thổ Chu.","Trường Sa và Phú Quốc.","Hoàng Sa và Trường Sa.","Côn Đảo và Phú Quý."],"ans":2,"id":18},{"part":1,"lesson":1,"n":20,"q":"Năm 1956 và năm 1974, chính quyền Trung Quốc đã dùng vũ lực chiếm đóng các nhóm đảo nào thuộc quần đảo Hoàng Sa?","opts":["Năm 1956 chiếm nhóm đảo phía Tây, năm 1974 chiếm nhóm đảo phía Đông.","Năm 1956 chiếm nhóm đảo phía Đông, năm 1974 chiếm nhóm đảo phía Tây.","Chiếm toàn bộ quần đảo Hoàng Sa ngay trong năm 1956.","Chiếm toàn bộ quần đảo Trường Sa năm 1974."],"ans":1,"id":19},{"part":1,"lesson":1,"n":21,"q":"Năm 1988, chính quyền Trung Quốc sử dụng vũ lực chiếm đóng trái phép một số bãi đá nào thuộc quần đảo Trường Sa của Việt Nam?","opts":["Chữ Thập, Châu Viên, Ga Ven, Tư Nghĩa, Gạc Ma, Xu Bi.","Song Tử Tây, Sơn Ca, Nam Yết, Sinh Tồn, Trường Sa Lớn.","Phú Quốc, Thổ Chu, Côn Đảo, Hòn Khoai.","Ba Bình, An Bảng, Bài Thuyền Chài, Bãi Cỏ Mây."],"ans":0,"id":20},{"part":1,"lesson":1,"n":22,"q":"Trong đấu tranh bảo vệ chủ quyền biển, đảo, quan điểm nhất quán của Đảng và Nhà nước ta là","opts":["Kiên quyết, kiên trì bảo vệ chủ quyền bằng các biện pháp hoà bình trên cơ sở luật pháp quốc tế.","Sử dụng giải pháp quân sự làm biện pháp ưu tiên hàng đầu,","Sẵn sàng nhượng bộ để giữ mối quan hệ ngoại giao.","Tự nguyện từ bỏ các bãi đã bị chiếm đóng để tránh xung đột."],"ans":0,"id":21},{"part":1,"lesson":1,"n":23,"q":"Văn bản pháp lý quốc tế quan trọng nào về biển năm 1982 mà Việt Nam căn cứ để khẳng định chủ quyền và quyền chủ quyền biển, đảo?","opts":["Tuyên bố DOC năm 2002,","Công ước Liên Hợp Quốc về Luật Biển năm 1982 (UNCLOS 1982),","Bộ Quy tắc ứng xử ở Biển Đông (COC),","Hiệp ước Genève năm 1954,"],"ans":1,"id":22},{"part":1,"lesson":1,"n":24,"q":"Một trong những nội dung nghệ thuật đấu tranh bảo vệ chủ quyền biển, đảo của Việt Nam là kết chặt chẽ các mặt đấu tranh nào?","opts":["Chính trị, kinh tế, ngoại giao, pháp lý, quân sự.","Thương mại, du lịch, thể thao, văn hoá.","Răn đe hạt nhân và cấm vận kinh tế.","Tuyên truyền truyền thông đen thuần."],"ans":0,"id":23},{"part":1,"lesson":1,"n":25,"q":"Trách nhiệm trực tiếp của học sinh trong sự nghiệp củng cố quốc phòng, an ninh và bảo vệ Tổ quốc là:","opts":["Trực tiếp chỉ huy các đơn vị quân đội thường trực.","Tích cực học tập nâng cao nhận thức, sẵn sàng thực hiện nghĩa vụ quân sự khi đủ tuổi.","Tự ý mua sắm trang thiết bị quân sự cá nhân.","Tự do đăng tải tin tức chưa kiểm chứng lên mạng xã hội."],"ans":1,"id":24},{"part":2,"lesson":1,"n":26,"q":"Xét các phát biểu sau đây về cuộc chiến tranh bảo vệ biên giới Tây Nam của Tổ quốc:","stmts":["Tập đoàn Pol Pot - Ieng Sary bắt đầu tấn công xâm phạm biên giới An Giang - Tây Ninh vào ngày 30/4/1977.","Cuộc chiến tranh bảo vệ biên giới Tây Nam hoàn toàn là do Việt Nam chủ động phát động nhằm mở rộng lãnh thổ.","Ngày 2/12/1978, Mặt trận Đoàn kết dân tộc cứu nước Campuchia ra đời.","Ngày 7/1/1979, Thủ đô Phnom Penh được hoàn toàn giải phóng, chấm dứt chế độ diệt chủng Pol Pot."],"ans":[true,false,true,true],"note":"","id":25},{"part":2,"lesson":1,"n":27,"q":"Khi nói về cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc năm 1979:","stmts":["Cuộc tiến công xâm lược của quân Trung Quốc diễn ra ngày 17/2/1979 trên toàn tuyến biên giới từ Quảng Ninh đến Lai Châu.","Chủ tịch nước Cộng hoà xã hội chủ nghĩa Việt Nam ra lệnh Tổng động viên vào ngày 5/3/1979.","Trong cuộc chiến đấu này, quân và dân ta đã vận dụng nghệ thuật quân sự \"lấy nhỏ đánh lớn, lấy ít địch nhiều.","Đến ngày 18/3/1979, phía Trung Quốc tuyên bố mở rộng tiến công xuống vùng đồng bằng Bắc Bộ."],"ans":[true,true,true,false],"note":"","id":26},{"part":2,"lesson":1,"n":28,"q":"Xét tính đúng/sai về chủ quyền biển, đảo của Việt Nam sau năm 1975:","stmts":["Việt Nam có bờ biển dài hơn 3 200 km và hơn 3 000 hòn đảo lớn nhỏ.","Việt Nam là Nhà nước đầu tiên xác lập, thực thi chủ quyền liên tục và hòa bình đối với hai quần đảo Hoàng Sa và Trường Sa.","Năm 1988, Trung Quốc dùng vũ lực chiếm đóng trái phép một số bãi đá thuộc quần đảo Hoàng Sa.","Việt Nam giải quyết các tranh chấp trên biển bằng biện pháp hòa bình dựa trên Công ước UNCLOS 1982 và tuyên bố DOC."],"ans":[true,true,false,true],"note":"","id":27},{"part":2,"lesson":1,"n":29,"q":"Về nghệ thuật quân sự Việt Nam trong bảo vệ Tổ quốc sau năm 1975:","stmts":["Đánh giá đúng bản chất, âm mưu, thủ đoạn của kẻ thù để không bị động, bất ngờ.","Chỉ tập trung lực lượng phòng ngự thụ động, không tổ chức phản công hay tiến công.","Kết hợp chặt chẽ lực lượng tại chỗ với các binh đoàn chủ lực.","Kết hợp sức mạnh dân tộc với sức mạnh thời đại, tranh thủ sự ủng hộ quốc tế."],"ans":[true,false,true,true],"note":"","id":28},{"part":2,"lesson":1,"n":30,"q":"Xét trách nhiệm của học sinh đối với sự nghiệp bảo vệ Tổ quốc:","stmts":["Tích cực học tập môn Giáo dục quốc phòng và an ninh để nâng cao nhận thức.","Có tinh thần cảnh giác cách mạng, phản bác các quan điểm sai trái, xuyên tạc lịch sử.","Sẵn sàng thực hiện nghĩa vụ quân sự, tham gia Công an nhân dân, Dân quân tự vệ khi đủ điều kiện.","Được phép chia sẻ các thông tin xuyên tạc lịch sử trên không gian mạng nếu không nhằm mục đích thương mại."],"ans":[true,true,true,false],"note":"","id":29},{"part":1,"lesson":4,"n":1,"q":"Chiến lược \"Diễn biến hoà bình\" là chiến lược cơ bản do chủ nghĩa đế quốc và các thế lực phản động tiến hành nhằm mục tiêu chính nào?","opts":["Phát động chiến tranh hạt nhân quy mô lớn tiêu diệt đối phương.","Lật đổ chế độ chính trị của các nước tiến bộ, trước hết là các nước XHCN từ bên trong, chủ yếu bằng biện pháp phi quân sự.","Cấm vận thương mại hoàn toàn để buộc đối phương phá sản.","Chiếm đóng quân sự trực tiếp toàn bộ lãnh thổ đối phương."],"ans":1,"id":30},{"part":1,"lesson":4,"n":2,"q":"Bạo loạn lật đổ là hành động chống phá bằng hình thức nào do lực lượng phản động tiến hành?","opts":["Bằng biện pháp ngoại giao hoà bình.","Bằng bạo lực có tổ chức nhằm gây rối an ninh chính trị, trật tự an toàn xã hội hoặc lật đổ chính quyền.","Bằng các cuộc tranh luận lý luận công khai trên báo chí.","Bằng việc khiếu nại hành chính tại các cơ quan tư pháp."],"ans":1,"id":31},{"part":1,"lesson":4,"n":3,"q":"Mối quan hệ giữa chiến lược \"Diễn biến hoà bình\" và bạo loạn lật đổ được xác định như thế nào?","opts":["Hai hoạt động này hoàn toàn độc lập và không có liên quan gì với nhau.","\"Diễn biến hoà bình\" tạo cơ sở, điều kiện cho bạo loạn lật đổ; bạo loạn lật đổ là hệ quả của \"Diễn biến hoà bình\".","Bạo loạn lật đổ diễn ra trước rồi mới xuất hiện \"Diễn biến hoà bình\".","Bạo loạn lật đổ thay thế hoàn toàn và làm mất vai trò của \"Diễn biến hoà bình\"."],"ans":1,"id":32},{"part":1,"lesson":4,"n":4,"q":"Âm mưu xuyên suốt của các thế lực thù địch khi thực hiện chiến lược \"Diễn biến hoà bình\" đối với cách mạng Việt Nam là gì?","opts":["Xoá bỏ vai trò lãnh đạo của Đảng Cộng sản Việt Nam, xóa bỏ chế độ xã hội chủ nghĩa, lái nước ta đi theo con đường tư bản chủ nghĩa.","Hỗ trợ Việt Nam xây dựng nền kinh tế thị trường hiện đại.","Thúc đẩy quá trình hội nhập quốc tế của Việt Nam diễn ra nhanh hơn.","Giúp đỡ Việt Nam nâng cao tiềm lực quốc phòng phòng thủ."],"ans":0,"id":33},{"part":1,"lesson":4,"n":5,"q":"Trong thủ đoạn thực hiện \"Diễn biến hoà bình\", các thế lực thù địch coi lĩnh vực nào là hàng đầu?","opts":["Lấy kinh tế làm hàng đầu.","Lấy chính trị, tư tưởng làm hàng đầu.","Lấy quân sự làm hàng đầu.","Lấy ngoại giao làm hàng đầu."],"ans":1,"id":34},{"part":1,"lesson":4,"n":6,"q":"Thủ đoạn lợi dụng lĩnh vực nào được các thế lực thù địch coi là \"ngòi nổ\" để chống phá Việt Nam?","opts":["Kinh tế và thương mại.","Dân tộc và tôn giáo.","Giáo dục và y tế.","Văn hoá và thể thao."],"ans":1,"id":35},{"part":1,"lesson":4,"n":7,"q":"Trên lĩnh vực kinh tế, thủ đoạn chống phá của các thế lực thù địch nhằm mục đích gì?","opts":["Hỗ trợ vốn đầu tư không hoàn lại.","Lợi dụng hoạt động đầu tư, liên doanh để làm lệch hướng nền kinh tế định hướng XHCN, làm yếu vai trò chủ đạo của kinh tế nhà nước.","Giúp chuyển giao công nghệ cao miễn phí.","Xóa bỏ toàn bộ nợ công cho Việt Nam."],"ans":1,"id":36},{"part":1,"lesson":4,"n":8,"q":"Trên không gian mạng, các thế lực thù địch thường sử dụng các phương tiện nào để tuyên truyền, kích động bạo loạn, rải tin giả?","opts":["Báo Nhân Dân và Cổng thông tin Chính phủ.","Các trang web, blog, diễn đàn, mạng xã hội (Facebook, Zalo, YouTube...).","Hệ thống đài truyền hình quốc gia VTV.","Các văn bản quy phạm pháp luật công khai."],"ans":1,"id":37},{"part":1,"lesson":4,"n":9,"q":"Thủ đoạn đòi \"phi chính trị hoá\" Quân đội nhân dân và Công an nhân dân của các thế lực thù địch nhằm mục đích gì?","opts":["Nâng cao tính chuyên nghiệp cho lực lượng vũ trang.","Tách lực lượng vũ trang khỏi sự lãnh đạo của Đảng, làm cho lực lượng vũ trang mất phương hướng chính trị,","Giảm ngân sách quốc phòng để đầu tư cho y tế.","Đưa quân đội tham gia các hoạt động kinh tế thương mại tự do."],"ans":1,"id":38},{"part":1,"lesson":4,"n":10,"q":"Quá trình thực hiện bạo loạn lật đổ của các thế lực thù địch thường trải qua hai bước cơ bản là:","opts":["Đàm phán ngoại giao và Ký kết hiệp định.","Chuẩn bị gây bạo loạn và Tiến hành bạo loạn lật đổ.","Tuyên truyền báo chí và Cấm vận kinh tế.","Tranh chấp biên giới và Phong tỏa đường biển,"],"ans":1,"id":39},{"part":1,"lesson":4,"n":11,"q":"Trong bước chuẩn bị gây bạo loạn lật đổ, kẻ thù tập trung thực hiện hành vi nào?","opts":["Xây dựng, nuôi dưỡng các tổ chức phản động, kích động, mua chuộc các phần tử bất mãn, lôi kéo quần chúng.","Công khai đối thoại trực tiếp với chính quyền.","Rút toàn bộ lực lượng về nước.","Tự giải thể các hội nhóm trái phép."],"ans":0,"id":40},{"part":1,"lesson":4,"n":12,"q":"Một trong những giải pháp phòng, chống chiến lược \"Diễn biến hoà bình”, bạo loạn lật đổ ở Việt Nam là:","opts":["Phát huy sức mạnh tổng hợp của cả hệ thống chính trị dưới sự lãnh đạo của Đảng.","Đóng cửa hoàn toàn biên giới và dừng hợp tác quốc tế.","Cấm sử dụng Internet trên phạm vi toàn quốc.","Cho phép tự do thành lập các đảng đối lập."],"ans":0,"id":41},{"part":1,"lesson":4,"n":13,"q":"Để nâng cao \"sức đề kháng\" của xã hội trước âm mưu \"Diễn biến hoà bình\", giải pháp quan trọng hàng đầu là:","opts":["Chú trọng tuyên truyền, giáo dục quan điểm, đường lối của Đảng, chính sách pháp luật của Nhà nước.","Tăng số lượng trang thiết bị vũ khí hạng nặng.","Ngừng việc giảng dạy môn GDQPAN trong nhà trường.","Mở rộng chia sẻ thông tin chưa kiểm chứng."],"ans":0,"id":42},{"part":1,"lesson":4,"n":14,"q":"Hành vi nào sau đây của học sinh thể hiện trách nhiệm phòng, chống chiến lược \"Diễn biến hoà bình\" trên không gian mạng?","opts":["Thường xuyên bấm \"LIKE\", chia sẻ các bài viết bôi nhọ, xuyên tạc chưa kiểm chứng.","Không đọc, xem, \"LIKE\", chia sẻ những thông tin chưa được kiểm chứng; chấp hành nghiêm Luật An ninh mạng.","Tự tạo tài khoản giả mạo để tranh luận chửi bới trên mạng.","Lôi kéo bạn bè tham gia các nhóm biểu tình tụ tập đông người trái phép."],"ans":1,"id":43},{"part":1,"lesson":4,"n":15,"q":"Khi phát hiện các thông tin xấu độc, bôi nhọ, xuyên tạc lịch sử trên mạng xã hội, thái độ đúng đắn của học sinh là:","opts":["Tò mò phát tán rộng rãi cho mọi người cùng xem.","Nâng cao cảnh giác, không tin theo và báo cáo với giáo viên, nhà trường hoặc cơ quan chức năng.","Tham gia bình luận ủng hộ các quan điểm sai trái.","Thờ ơ, coi như không liên quan đến bản thân."],"ans":1,"id":44},{"part":2,"lesson":4,"n":16,"q":"Xét khái niệm và mối quan hệ giữa \"Diễn biến hoà bình\" và bạo loạn lật đổ:","stmts":["\"Diễn biến hoà bình\" nhằm lật đổ chế độ XHCN từ bên trong, chủ yếu bằng biện pháp phi quân sự.","Bạo loạn lật đổ là hành động chống phá bằng bạo lực có tổ chức do lực lượng phản động tiến hành.","Bạo loạn lật đổ và \"Diễn biến hoà bình\" không có liên quan gì với nhau.","\"Diễn biến hòa bình\" là cơ sở, tạo điều kiện và thời cơ cho bạo loạn lật đổ diễn ra."],"ans":[true,true,false,true],"note":"","id":45},{"part":2,"lesson":4,"n":17,"q":"Về âm mưu và thủ đoạn thực hiện \"Diễn biến hoà bình\" ở Việt Nam:","stmts":["Âm mưu tối cao là xoá bỏ vai trò lãnh đạo của Đảng Cộng sản Việt Nam và chế độ XHCN.","Kẻ thù lấy chính trị, tư tưởng làm hàng đầu, lấy kinh tế làm mũi nhọn.","Kẻ thù tuyệt đối không bao giờ sử dụng yếu tố quân sự để răn đe.","Lợi dụng vấn đề dân tộc, tôn giáo làm ngòi nổ để kích động chống phá"],"ans":[true,true,false,true],"note":"","id":46},{"part":2,"lesson":4,"n":18,"q":"Xét thủ đoạn của kẻ thù trên không gian mạng và đối với lực lượng vũ trang:","stmts":["Sử dụng mạng xã hội (Facebook, YouTube, Zalo...) để lan truyền tin giả, bôi nhọ lãnh đạo.","Đòi 'phi chính trị hoá' Quân đội và Công an nhằm tách lực lượng vũ trang khỏi sự lãnh đạo của Đảng.","Kêu gọi thanh niên chấp hành nghiêm Luật An ninh mạng.","Tuyên truyền lối sống thực dụng, ăn chơi, làm mất bản sắc văn hoá dân tộc."],"ans":[true,true,false,true],"note":"","id":47},{"part":2,"lesson":4,"n":19,"q":"Về giải pháp phòng, chống chiến lược \"Diễn biến hoà bình”, bạo loạn lật đổ","stmts":["Phát huy sức mạnh tổng hợp của cả hệ thống chính trị dưới sự lãnh đạo của Đảng.","Chú trọng giáo dục đường lối của Đảng, chính sách pháp luật của Nhà nước cho toàn dân.","Thực hiện tốt chính sách dân tộc, tôn giáo, chăm lo đời sống nhân dân.","Xử lý nhẹ nhàng, nương tay đối với những kẻ cầm đầu kích động bạo loạn."],"ans":[true,true,true,false],"note":"","id":48},{"part":2,"lesson":4,"n":20,"q":"Xét trách nhiệm của học sinh đối với việc phòng chống chống phá trên mạng xã hội:","stmts":["Tích cực học tập, nâng cao nhận thức chính trị và ý thức chấp hành pháp luật.","Tuyệt đối không đọc, \"LIKE\", hay chia sẻ các bài viết có nội dung xấu độc, chưa kiểm chứng.","Thường xuyên tham gia các hội nhóm kín kích động tụ tập đông người.","Kịp thời phát hiện và báo cáo với giáo viên, nhà trường về các thông tin sai trái."],"ans":[true,true,false,true],"note":"","id":49}];
const app=document.getElementById('app'),$=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const SETS=[[1,1,'Phần I, Bài 1 (trắc nghiệm)'],[1,4,'Phần I, Bài 4 (trắc nghiệm)'],[2,1,'Phần II, Bài 1 (đúng/sai)'],[2,4,'Phần II, Bài 4 (đúng/sai)']];
let S={orig:[],list:[],ans:{},i:0,shuf:true,inst:true,warn:false,tab:'wrong',t0:0,el:0,iv:0};
function tick(){S.el=Math.floor((Date.now()-S.t0)/1000);const e=$('#tm');if(e)e.textContent='⏱ '+fmt(S.el)}
const done=q=>{const a=S.ans[q.id];return q.part==1?a!==undefined:Array.isArray(a)&&a.every(x=>x!==null)};
function grade(q){const a=S.ans[q.id];if(q.part==1)return{q,ok:a===q.ans};const c=q.ans.filter((v,k)=>a&&a[k]===v).length;return{q,ok:c==4,c}}
const rq=()=>{const y=scrollY;quiz();scrollTo(0,y)};
const go=i=>{S.i=i;quiz();scrollTo(0,0)};

function home(){
  clearInterval(S.iv);
  const cnt=(p,l)=>Q.filter(q=>q.part==p&&q.lesson==l).length;
  app.innerHTML=`<h1>Luyện tập GDQPAN: Bài 1 và Bài 4</h1><p class="mu">Chọn chế độ xem đáp án ngay hoặc nộp bài rồi mới xem.</p>
  <div class="card"><h2>Chọn phần muốn làm</h2>
  ${SETS.map(([p,l,t],k)=>`<label class="chk"><input type="checkbox" data-k="${k}" checked><span>${t}</span><b>${cnt(p,l)} câu</b></label>`).join('')}
  <label class="chk"><input type="checkbox" id="inst" ${S.inst?'checked':''}><span>Xem đúng/sai ngay khi chọn đáp án</span></label>
  <label class="chk"><input type="checkbox" id="shuf" ${S.shuf?'checked':''}><span>Xáo trộn thứ tự câu hỏi</span></label></div>
  <p class="nt" id="err"></p><button class="btn pri" id="go">Bắt đầu làm bài</button>`;
  $('#go').onclick=()=>{
    const ks=[...document.querySelectorAll('[data-k]:checked')].map(e=>+e.dataset.k);
    if(!ks.length){$('#err').textContent='Hãy chọn ít nhất một phần.';return}
    S.shuf=$('#shuf').checked;S.inst=$('#inst').checked;
    start(Q.filter(q=>ks.some(k=>SETS[k][0]==q.part&&SETS[k][1]==q.lesson)),true);
  };
}
function start(list,orig){
  if(orig)S.orig=list;
  S.list=S.shuf?shuffle(list):list;S.ans={};S.i=0;S.warn=false;S.tab='wrong';
  S.t0=Date.now();S.el=0;clearInterval(S.iv);S.iv=setInterval(tick,1000);quiz();scrollTo(0,0);
}

function quiz(){
  const q=S.list[S.i],n=S.list.length,a=S.ans[q.id];
  const left=S.list.filter(x=>!done(x)).length,w=S.warn&&left;
  let body,fb='';
  if(q.part==1){
    const dn=S.inst&&a!==undefined;
    body=q.opts.map((o,k)=>{const c=dn?(k===q.ans?' ok':k===a?' no':''):(a===k?' sel':'');
      return `<button class="opt${c}" data-k="${k}" ${dn?'disabled':''}><span class="lt">${'ABCD'[k]}</span><span>${esc(o)}</span>${dn&&k===q.ans?'<em>Đáp án đúng</em>':dn&&k===a?'<em>Bạn chọn</em>':''}</button>`}).join('');
    if(dn)fb=a===q.ans?'<p class="gt">Chính xác!</p>':`<p class="nt">Sai rồi. Đáp án đúng là ${'ABCD'[q.ans]}.</p>`;
  }else{
    body=q.stmts.map((s,k)=>{const m=a?a[k]:null,r=q.ans[k];
      return `<div class="st${m===null||!S.inst?'':m===r?' ok':' no'}"><p><b>${'abcd'[k]})</b> ${esc(s)}</p><div class="seg">${[true,false].map(v=>`<button data-k="${k}" data-v="${v}" ${S.inst&&m!==null?'disabled':''} class="${S.inst?(m!==null&&v===r?'ok':m===v&&v!==r?'no':''):(m===v?'sel':'')}">${v?'Đúng':'Sai'}</button>`).join('')}</div>${m===null||!S.inst?'':`<div class="sm ${m===r?'gt':'nt'}">${m===r?'Chính xác!':'Sai rồi. Đáp án là '+(r?'Đúng':'Sai')+'.'}</div>`}</div>`}).join('');
    if(S.inst&&done(q)&&q.note)fb=`<p class="note">Giải thích: ${esc(q.note)}.</p>`;
  }
  const pc=x=>!done(x)?'':!S.inst?'dn':grade(x).ok?'okc':'noc';
  app.innerHTML=`<div class="top"><span class="tm" id="tm">⏱ ${fmt(S.el)}</span><button class="btn pri" id="sub">Nộp bài</button></div>
  <div class="bar"><span>Câu ${S.i+1}/${n}</span><span class="${w?'nt':'mu'} sm">${w?`Còn ${left} câu chưa làm. Bấm Nộp bài lần nữa`:`Còn ${left} câu chưa làm`}</span></div>
  <div class="prog"><i style="width:${(n-left)/n*100}%"></i></div>
  <div class="card"><div class="mu sm">${q.part==1?'Chọn một đáp án đúng':'Chọn Đúng hoặc Sai cho từng ý'}</div><h2 class="q">${esc(q.q)}</h2>${body}${fb}</div>
  <div class="nav"><button class="btn" id="pv" ${S.i==0?'disabled':''}>Câu trước</button><button class="btn" id="nx" ${S.i==n-1?'disabled':''}>Câu sau</button></div>
  <details class="card"><summary>Danh sách câu hỏi</summary><div class="pal">${S.list.map((x,k)=>`<button data-j="${k}" class="${pc(x)}${k==S.i?' cur':''}">${k+1}</button>`).join('')}</div></details>`;
  if(q.part==1)app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!S.inst||S.ans[q.id]===undefined){S.ans[q.id]=+b.dataset.k;S.warn=false;rq()}});
  else app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{const r=S.ans[q.id]||(S.ans[q.id]=[null,null,null,null]),k=+b.dataset.k;if(!S.inst||r[k]===null){r[k]=b.dataset.v==='true';S.warn=false;rq()}});
  $('#pv').onclick=()=>go(S.i-1);$('#nx').onclick=()=>go(S.i+1);
  app.querySelectorAll('.pal button').forEach(b=>b.onclick=()=>go(+b.dataset.j));
  $('#sub').onclick=()=>{if(left&&!S.warn){S.warn=true;rq()}else finish()};
}
function finish(){clearInterval(S.iv);tick();S.tab='wrong';result();scrollTo(0,0)}

function review({q,ok,c}){
  const a=S.ans[q.id],no=S.list.indexOf(q)+1;let b;
  if(q.part==1){
    b=q.opts.map((o,k)=>{const right=k===q.ans,mine=k===a;
      return `<div class="opt${right?' ok':mine?' no':''}"><span class="lt">${'ABCD'[k]}</span><span>${esc(o)}</span>${right?'<em>Đáp án đúng</em>':mine?'<em>Bạn chọn</em>':''}</div>`}).join('');
    if(a===undefined)b+='<p class="nt">Bạn chưa trả lời câu này.</p>';
  }else{
    b=q.stmts.map((s,k)=>{const m=a?a[k]:null,r=q.ans[k],good=m===r;
      return `<div class="st ${good?'ok':'no'}"><p><b>${'abcd'[k]})</b> ${esc(s)}</p><div class="sm">Bạn chọn: <b>${m===null?'chưa chọn':m?'Đúng':'Sai'}</b>, đáp án: <b>${r?'Đúng':'Sai'}</b> ${good?'✓':'✗'}</div></div>`}).join('');
    if(q.note)b+=`<p class="note">Giải thích: ${esc(q.note)}.</p>`;
  }
  return `<div class="card rv ${ok?'okc':'noc'}"><div class="mu sm">Câu ${no}${q.part==2?`, đúng ${c}/4 ý`:''}</div><h3 class="q">${esc(q.q)}</h3>${b}</div>`;
}
function result(){
  const g=S.list.map(grade),wrong=g.filter(x=>!x.ok),n=g.length,r=n-wrong.length;
  const show=S.tab=='wrong'?wrong:g;
  app.innerHTML=`<div class="card sum"><div class="big">${r}/${n}</div><div>câu đúng, ${Math.round(r/n*100)}%</div><div class="mu">Thời gian: ${fmt(S.el)}</div></div>
  <div class="acts">${wrong.length?`<button class="btn pri" id="rw">Làm lại ${wrong.length} câu sai</button>`:'<p class="gt">Bạn đã làm đúng hết. Giỏi lắm!</p>'}
  <button class="btn" id="ra">Làm lại toàn bộ đề</button><button class="btn" id="hm">Về trang chủ</button></div>
  <div class="tabs"><button data-t="wrong" class="${S.tab=='wrong'?'sel':''}">Câu sai (${wrong.length})</button><button data-t="all" class="${S.tab=='all'?'sel':''}">Tất cả (${n})</button></div>
  ${show.map(review).join('')||'<p class="mu">Không có câu sai nào.</p>'}`;
  if(wrong.length)$('#rw').onclick=()=>start(wrong.map(x=>x.q));
  $('#ra').onclick=()=>start(S.orig,true);$('#hm').onclick=home;
  app.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;const y=scrollY;result();scrollTo(0,y)});
}
home();
</script>
</body>
</html>
